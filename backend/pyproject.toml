[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-meeting-intelligence"
version = "0.1.0"
description = "Meeting intelligence RAG backend — provider-agnostic LLM, local embeddings & Whisper"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.3.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "numpy>=2.1.0",
    "faster-whisper>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit>=1.8.0",
]
eval = [
    "ragas>=0.2.0",
    "datasets>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/clinical_meeting/api/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["clinical_meeting"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["clinical_meeting"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
